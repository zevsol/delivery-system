[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-system"
version = "0.1.0"
description = "Corrective Runtime Prototype for deterministic delivery planning."
requires-python = ">=3.10"
dependencies = [
  "mcp==2.0.0",
]

[project.scripts]
delivery-system-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = ["delivery_system", "delivery_system.drivers", "mcp_server"]
