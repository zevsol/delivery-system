interface:
  display_name: "Apply GitHub Work Items"
  short_description: "Apply an explicitly approved Sealed Preview"
  default_prompt: "Use $apply-github-work-items to apply an explicitly approved Delivery System Sealed Preview."

dependencies:
  tools:
    - type: "mcp"
      value: "delivery_get_audit_context"
      description: "Read the exact approved Preview context before application"
      transport: "stdio"
    - type: "mcp"
      value: "delivery_issue_application_authority"
      description: "Internal Runtime support for protected application authority; it does not write to GitHub"
      transport: "stdio"
    - type: "mcp"
      value: "delivery_apply_approved_work_items"
      description: "Execute the bounded approved application; it may mutate GitHub Issues"
      transport: "stdio"
    - type: "mcp"
      value: "delivery_get_application_status"
      description: "Read bounded durable Application status and recovery evidence; it does not retry, resume, reconcile, or write to GitHub"
      transport: "stdio"
    - type: "mcp"
      value: "delivery_observe_application_postcondition"
      description: "Read restricted OutcomeUnknown relationship postcondition evidence; it does not establish causal attribution, authorize retry or resume, or write to GitHub"
      transport: "stdio"
